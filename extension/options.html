<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Overdue Action Alerts — Settings</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; width: 420px; }
      label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
      input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 14px; }
      #status { margin-top: 10px; font-size: 13px; color: #27ae60; }
      p.hint { font-size: 12px; color: #666; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <h2>Overdue Action Alerts</h2>

    <label for="viewUrl">Airtable view URL to monitor</label>
    <input id="viewUrl" type="text" placeholder="https://airtable.com/appXXXX/tblXXXX/viwXXXX" />
    <p class="hint">Open the Chase SDR View, copy the exact URL from the address bar.</p>

    <label for="webhookUrl">Slack Incoming Webhook URL</label>
    <input id="webhookUrl" type="text" placeholder="https://hooks.slack.com/services/..." />

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
